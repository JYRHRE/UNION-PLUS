function bindEv(){
  const{page,menu,students,sid,sAns:ans,sQ:cq,form:f}=S;
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener("click",fn);};
  const onA=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener("click",fn));

  // 공통
  on("backup-nudge",()=>set({menu:"admin"}));
  on("sync-badge",()=>{
    if(!USE_DB()){ set({menu:"admin"}); toast("관리자 메뉴에서 DB를 연결해 주세요."); return; }
    toast("🔄 학교 데이터를 불러오는 중...");
    autoSync(true);
  });
  on("btn-logout",async()=>{
    await sbSignOut();
    set({page:"login",role:null,pwErr:"",sid:null,menu:"survey",students:[],diag:null,tcName:""});
    toast("로그아웃했어요.");
  });
  onA(".nav-btn",e=>set({menu:e.currentTarget.dataset.menu,sid:null}));
  onA(".sf",e=>set({schoolFilter:e.target.dataset.key}));
  on("btn-go-db",()=>set({menu:"admin"}));

  // ── 로그인 ──
  if(page==="login"){
    // 공지 배너 클릭 → 내용 펼침
    const nb=document.getElementById("notice-banner");
    if(nb){
      nb.addEventListener("click",()=>{
        const box=document.getElementById("notice-content-box");
        const arrow=document.getElementById("notice-arrow");
        if(!box)return;
        const isOpen=box.style.display!=="none";
        box.style.display=isOpen?"none":"block";
        if(arrow)arrow.style.transform=isOpen?"":"rotate(180deg)";
        nb.style.boxShadow=isOpen?"none":"0 4px 16px rgba(108,99,255,.15)";
      });
    }
    on("btn-student",()=>set({page:"stuEnter",role:"student",stuGrade:3,stuCls:1,stuNameErr:""}));
    on("btn-teacher",()=>{const b=document.getElementById("pw-box");if(b)b.style.display=b.style.display==="none"?"block":"none";setTimeout(()=>document.getElementById("pw-input")&&document.getElementById("pw-input").focus(),50);});
    on("btn-external",()=>set({page:"extEnter",role:"external",extOrg:EXT_ORGS[0],extName:""}));
    const reopen=()=>setTimeout(()=>{
      const b=document.getElementById("pw-box");if(b)b.style.display="block";
      const p=document.getElementById("pw-input");if(p)p.focus();
    },30);
    const tryLogin=async()=>{
      const pwEl=document.getElementById("pw-input");
      const v=pwEl?pwEl.value:"";
      if(!USE_DB()){
        // DB 미연결 — 예전 방식으로 동작
        if(v===getPw())set({page:"tcEnter",role:"teacher",pwErr:""});
        else{set({pwErr:"비밀번호가 맞지 않습니다."});reopen();}
        return;
      }
      const emEl=document.getElementById("em-input");
      const email=emEl?emEl.value.trim():"";
      if(!email||!v){set({loginEmail:email,pwErr:"아이디와 비밀번호를 모두 입력해 주세요."});reopen();return;}
      S.loginEmail=email;S.loggingIn=true;set({pwErr:""});reopen();
      const r=await sbSignIn(email,v);
      S.loggingIn=false;
      if(!r.ok){set({pwErr:r.msg});reopen();return;}
      // ① 계정에 저장해 둔 정보 ② 아이디에서 읽어낸 학년·반 순으로 적용한다
      const acct=parseAcct(email);
      const prof=readTcProfile(r.user)||acct;
      if(applyTcProfile(prof)){
        if(acct&&acct.year)S.schoolYear=acct.year;
        set({page:"teacher",menu:"survey",role:"teacher",pwErr:"",loginEmail:"",diag:null});
        toast(S.tcIsSpecial?"전담교사로 입장했어요."
              :(S.tcGrade+"학년 "+S.tcCls+"반으로 입장했어요."));
        // 아이디로 읽은 정보는 계정에도 남겨둔다
        if(!readTcProfile(r.user)&&acct)saveTcProfile(acct);
      }else{
        // 아이디가 숫자 8자리 형식이 아닐 때만 물어본다
        set({page:"tcEnter",role:"teacher",pwErr:"",loginEmail:"",diag:null});
      }
      autoSync(true);
    };
    on("btn-reset-db",()=>{
      try{ localStorage.removeItem("sb_url"); localStorage.removeItem("sb_key"); }catch(e){}
      toast("학교 설정으로 되돌렸어요. 다시 불러옵니다...");
      setTimeout(()=>location.reload(),600);
    });
    on("btn-diag",async()=>{
      S.diagRunning=true;set({});reopen();
      const r=await diagNet();
      S.diagRunning=false;set({diag:r});reopen();
    });
    on("btn-pw-ok",tryLogin);
    ["pw-input","em-input"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
    });
  }

  // ── 학생 입장 ──
  if(page==="stuEnter"){
    on("bk",()=>set({page:"login"}));
    // 입력한 이름을 상태에 즉시 반영 — 안 하면 학년/반을 누를 때 재렌더되며 이름이 날아간다
    const sni=document.getElementById("stu-name");
    if(sni){
      sni.addEventListener("input",()=>{
        S.stuName=sni.value;
        if(S.stuNameErr){S.stuNameErr="";}
        const btn=document.getElementById("btn-stu-go");
        if(btn){const okGo=sni.value.trim().length>0&&S.stuCls>0;
          btn.disabled=!okGo;btn.textContent=okGo?"설문 시작하기":"이름과 반을 골라주세요";}
      });
      sni.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=document.getElementById("btn-stu-go");if(b&&!b.disabled)b.click();}});
    }
    onA(".stu-gb",e=>{
      const el=e.target.closest("[data-g]");if(!el)return;
      const ni=document.getElementById("stu-name");if(ni)S.stuName=ni.value;
      set({stuGrade:Number(el.dataset.g)});
    });
    onA(".stu-cb",e=>{
      const btn=e.target.closest(".stu-cb");if(!btn)return;
      const ni=document.getElementById("stu-name");if(ni)S.stuName=ni.value;
      set({stuCls:Number(btn.dataset.c)});
    });
    const go=async()=>{
      const ni=document.getElementById("stu-name");const name=(ni?ni.value.trim():"")||S.stuName||"";
      if(!name){S.stuNameErr="이름을 입력해주세요.";render();setTimeout(()=>{const el=document.getElementById("stu-name");if(el)el.focus();},30);return;}
      const grade=S.stuGrade,cls=S.stuCls;
      if(!cls){toast("반을 선택해주세요.");return;}
      // ① 이 기기에 이미 있나
      let found=S.students.find(s=>String(s.name).trim()===name&&Number(s.grade)===grade&&Number(s.cls)===cls);

      // ② 없으면 서버에 물어본다 (기기를 바꿔도 같은 사람으로 이어지도록)
      if(!found&&USE_DB()){
        const btn=document.getElementById("btn-stu-go");
        if(btn){btn.disabled=true;btn.textContent="확인하는 중...";}
        const sid0=await dbFindStudentId(name,grade,cls);
        if(btn){btn.disabled=false;btn.textContent="설문 시작하기";}
        if(sid0){
          // 서버에 있던 학생 — 껍데기만 만들어 이어붙인다.
          // 점수·기록은 읽을 수 없으므로 제출할 때 서버에서 합쳐진다.
          found={id:sid0,name,grade,cls,teacher:"",country:"대한민국",stype:"일반학생",
                 at:td(),scores:null,scoreHistory:[],logs:[],supports:[],_fromServer:true};
          S.students=[...S.students,found];saveSt(S.students);
        }
      }

      // ③ 그래도 없으면 새 학생
      if(!found){
        found={id:uid(),name,grade,cls,teacher:"",country:"대한민국",stype:"일반학생",
               at:td(),scores:null,scoreHistory:[],logs:[],supports:[]};
        S.students=[...S.students,found];saveSt(S.students);
      }
      set({sid:found.id,page:"student",menu:"svStart",sAns:{},sQ:0,stuNameErr:""});
    };
    on("btn-stu-go",go);
    if(sni)setTimeout(()=>sni.focus(),50);
  }

  // ── 교사 정보 입력 ──
  if(page==="tcEnter"){
    // 로그인한 상태에서 정보를 고치러 온 경우엔 관리자 화면으로 돌아간다
    on("bk",()=>{ if(isAuthed()&&S.tcName)set({page:"teacher",menu:"admin"}); else set({page:"login"}); });
    on("btn-type-hr",()=>{S.tcIsSpecial=false;render();});
    on("btn-type-sp",()=>{S.tcIsSpecial=true;render();});
    onA(".tc-gb",e=>{const g=Number(e.target.dataset.g);S.tcGrade=g;document.querySelectorAll(".tc-gb").forEach(b=>{const a=Number(b.dataset.g)===g;b.style.border="1.5px solid "+(a?"var(--p)":"var(--b)");b.style.background=a?"var(--p)":"var(--s)";b.style.color=a?"#fff":"var(--m)";});});
    onA(".tc-cb",e=>{const c=Number(e.target.dataset.c);S.tcCls=c;document.querySelectorAll(".tc-cb").forEach(b=>{const a=Number(b.dataset.c)===c;b.style.border="1.5px solid "+(a?"var(--p)":"var(--b)");b.style.background=a?"var(--p)":"var(--s)";b.style.color=a?"#fff":"var(--m)";});});
    on("btn-tc-go",async()=>{
      const ni=document.getElementById("tc-name");const name=ni?ni.value.trim():"";
      if(!name){toast("선생님 이름을 입력해 주세요.");if(ni)ni.focus();return;}
      set({tcName:name,page:"teacher",menu:"survey"});
      // 계정에 저장 — 다음 로그인부터는 이 화면을 건너뛴다
      saveTcProfile({tcName:name,tcIsSpecial:!!S.tcIsSpecial,tcGrade:S.tcGrade,tcCls:S.tcCls})
        .then(saved=>{ if(saved)toast("정보를 저장했어요. 다음부터는 바로 들어옵니다."); });
      // DB에서 최신 데이터 동기화
      if(USE_DB()){
        // 비동기로 백그라운드 동기화 (화면 전환 후)
        setTimeout(async()=>{
          try{ await syncFromDB(); }catch(e){/* silent */}
        },800);
      }
    });
    const tni=document.getElementById("tc-name");if(tni){tni.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=document.getElementById("btn-tc-go");if(b)b.click();}});setTimeout(()=>tni.focus(),50);}
  }

  // ── 외부기관 입장 ──
  if(page==="extEnter"){
    on("bk",()=>set({page:"login"}));
    onA(".org-btn",e=>{S.extOrg=e.currentTarget.dataset.org;render();});
    on("btn-ext-go",async()=>{
      const ni=document.getElementById("ext-name");const name=ni?ni.value.trim():"";
      set({extName:name,page:"external",menu:"ext_students"});
      // DB 동기화 (외부기관도 최신 학생 데이터 필요)
      if(USE_DB()){
        setTimeout(async()=>{
          try{ await syncFromDB(); }catch(e){/* 무시 */}
        },600);
      }
    });
    const eni=document.getElementById("ext-name");if(eni)eni.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=document.getElementById("btn-ext-go");if(b)b.click();}});
  }

  // ── 교사 설문관리 ──
  if(page==="teacher"&&menu==="survey"){
    on("btn-add",()=>set({menu:"formAdd",form:{name:"",grade:S.tcGrade,cls:S.tcCls,teacher:S.tcIsSpecial?"":S.tcName},fe:{}}));
    // 학생 카드 삭제 버튼
    document.querySelectorAll(".scd-del-btn").forEach(btn=>{

        const key=v=>(v.date||"")+"|"+SUBS.map(k=>(subScores(v.scores)||{})[k]).join(",");

          const g={};
          (S.students||[]).forEach(s=>{const k=String(s.name).trim()+"|"+s.grade+"|"+s.cls;(g[k]=g[k]||[]).push(s);});
          const keep=[],drop=[];
          Object.values(g).forEach(a=>{
            if(a.length===1){keep.push(a[0]);return;}
            // 가장 먼저 등록된 기록을 기준으로 삼는다
            a.sort((x,y)=>String(x.at||"").localeCompare(String(y.at||"")));
            const base=a[0];
            let hist=[],logs=[],sups=[];
            a.forEach(s=>{
              hist=hist.concat((s.scoreHistory&&s.scoreHistory.length)?s.scoreHistory:(s.scores?[{date:s.at,scores:s.scores}]:[]));
              logs=logs.concat(s.logs||[]);
              sups=sups.concat(s.supports||[]);
            });
            // 같은 날 같은 점수는 한 번만
            const seen=new Set(),h2=[];
            hist.sort((x,y)=>String(x.date||"").localeCompare(String(y.date||"")));
            hist.forEach(r=>{const k2=(r.date||"")+"|"+SUBS.map(k3=>(subScores(r.scores)||{})[k3]).join(",");
              if(!seen.has(k2)){seen.add(k2);h2.push(r);}});
            const seenL=new Set(),l2=[];
            logs.forEach(l=>{const k2=(l.date||"")+"|"+(l.author||"")+"|"+(l.memo||"");
              if(!seenL.has(k2)){seenL.add(k2);l2.push(l);}});
            keep.push({...base,
              // 비어 있지 않은 정보를 우선 살린다

        if(extStu){
          const es2={...extStu,logs:[lg,...extStu.logs]};
          set({students:S.students.map(x=>x.id===sid?es2:x),lMemo:"",lTags:[]});
          dbSaveStudent(es2).catch(()=>{});
        }
        toast("기록이 저장되었습니다.");});
    }
  }
}

// ── 삭제 비밀번호 모달 ─────────────────────────────
const DEL_PW = "1234";           // 회차·기록·학생 삭제용
const ADMIN_PW = "nadong1234";   // 관리자 화면 진입용
let _delCallback = null;

function showDelModal(studentName, onConfirm){
  const modal = document.getElementById("del-modal");
  const nameEl = document.getElementById("del-modal-name");
  const pwEl = document.getElementById("del-pw-input");
  const errEl = document.getElementById("del-pw-err");
  if(!modal) return;
  // "…" 로 시작하면 문장을 그대로 쓴다 (회차 삭제 등)
  nameEl.textContent = String(studentName).indexOf("…")===0
    ? String(studentName).slice(1)
    : studentName + " 학생을 정말 삭제할까요?";
  pwEl.value = "";
  errEl.textContent = "";
  _delCallback = onConfirm;
  modal.style.display = "flex";
  modal.style.alignItems = "center";
  modal.style.justifyContent = "center";
  setTimeout(()=>pwEl.focus(), 100);
}

function hideDelModal(){
  const modal = document.getElementById("del-modal");
  if(modal) modal.style.display = "none";
  _delCallback = null;
}

// 모달 이벤트 - DOM 로드 후 한 번만 등록
window.addEventListener("load", ()=>{
  const cancelBtn = document.getElementById("del-modal-cancel");
  const confirmBtn = document.getElementById("del-modal-confirm");
  const pwEl = document.getElementById("del-pw-input");
  const errEl = document.getElementById("del-pw-err");
  const modal = document.getElementById("del-modal");

  if(cancelBtn) cancelBtn.addEventListener("click", hideDelModal);

  // 배경 클릭 시 닫기
  if(modal) modal.addEventListener("click", e=>{
    if(e.target === modal) hideDelModal();
  });

  if(confirmBtn) confirmBtn.addEventListener("click", ()=>{
    const pw = pwEl ? pwEl.value : "";
    if(pw !== DEL_PW){
      if(errEl) errEl.textContent = "❌ 비밀번호가 틀렸어요!";
      if(pwEl){ pwEl.value=""; pwEl.focus(); }
      return;
    }
    const cb = _delCallback;   // 모달을 닫으면 콜백이 지워지므로 먼저 붙잡아 둔다
    hideDelModal();
    if(cb) cb();
  });

  // 엔터 키로 확인
  if(pwEl) pwEl.addEventListener("keydown", e=>{
    if(e.key === "Enter") confirmBtn && confirmBtn.click();
  });
});





// 데이터 로드 (함수 선언 후)
S.students = loadSt();
S.notices   = loadNotices();
S.programs  = loadPrograms();
S.resources = loadResources();

render();

// 최신 버전인지 먼저 확인 (캐시된 옛 화면 방지)
setTimeout(checkForUpdate, 600);

// ── 시작하자마자 학교 공용 데이터에 합류 ──────────────────
// 로컬 데이터로 먼저 그린 뒤, 서버 데이터가 도착하면 다시 그린다.
(async function joinSchoolData(){
  if(!USE_DB())return;
  if(SCHOOL_DB.url && !isAuthed())return;   // 로그인 후에 합류한다
  S._syncing=true;render();
  try{
    // 이 기기에만 있던 학생을 먼저 올려서 유실을 막는다
    const before=(loadSt()||[]).length;
    if(before)await pushLocalToDB().catch(()=>{});
    await syncFromDB();
    if(S._syncOk!==false){
      const n=(S.students||[]).length;
      if(n>before)toast("학교 공용 데이터 "+n+"명을 불러왔어요.");
    }
  }catch(e){
    S._syncing=false;
    S._syncErr="학교 데이터를 불러오지 못했습니다. 왼쪽 배지를 눌러 다시 시도해 주세요.";
    render();
  }
})();
</script>
