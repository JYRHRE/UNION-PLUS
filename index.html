<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UNION+ 다문화 역량 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 교사/시스템 컬러 */
  --p:#5B4EE8;--pl:#EEF0FF;--s:#fff;--bg:#F5F4FB;--b:#E8E6F4;--t:#1A1835;--m:#8884AA;--d:#E8445A;--g:#22C79A;--gl:#E3FAF4;
  /* 학생 전용 컬러 */
  --stu-1:#FF6B6B;--stu-2:#FF9F43;--stu-3:#FECA57;--stu-4:#48DBFB;--stu-5:#FF9FF3;--stu-6:#54A0FF;
  --stu-bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --stu-card:#ffffffcc;
}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:14px;color:var(--t);background:var(--bg);min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#D0CEE8;border-radius:2px}

/* 애니메이션 */
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes si{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes dp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.fu{animation:fu .25s ease}
.si{animation:si .3s cubic-bezier(.34,1.56,.64,1)}
.bounce{animation:bounce 2s ease-in-out infinite}
.float{animation:float 3s ease-in-out infinite}

/* 교사 레이아웃 */
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;overflow-y:auto}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.nav-btn{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;border-radius:10px;margin:2px 10px;transition:all .15s;color:#C8C6E8;font-size:13px;font-weight:600;border:none;background:none;width:calc(100% - 20px);text-align:left}
.nav-btn:hover{background:#ffffff20;color:#fff;transform:translateX(3px)}
.nav-btn.on{background:var(--p);color:#fff;box-shadow:0 4px 12px #5B4EE840}

/* 카드 */
.card{background:var(--s);border-radius:16px;border:1px solid var(--b);padding:16px}

/* 버튼 */
.btn-p{padding:13px 0;border-radius:14px;border:none;background:var(--p);color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:15px;transition:all .15s;box-shadow:0 4px 14px #5B4EE840}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px #5B4EE850}
.btn-p:active{transform:translateY(0)}
.btn-g{padding:13px 0;border-radius:14px;border:none;background:var(--g);color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:15px;transition:all .15s;box-shadow:0 4px 14px #22C79A40}
.btn-g:hover{transform:translateY(-2px)}
.btn-out{padding:13px 0;border-radius:14px;border:1.5px solid var(--b);background:var(--s);color:var(--m);font-weight:600;cursor:pointer;width:100%;font-size:15px;transition:all .15s}
.btn-out:hover{border-color:var(--p);color:var(--p)}

/* 학생 전용 버튼 */
.btn-stu{padding:16px 0;border-radius:20px;border:none;color:#fff;font-weight:900;cursor:pointer;width:100%;font-size:18px;transition:all .2s;position:relative;overflow:hidden;letter-spacing:-.3px}
.btn-stu::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,transparent 100%)}
.btn-stu:hover{transform:translateY(-3px) scale(1.02)}
.btn-stu:active{transform:scale(.97)}

/* 교사 학생카드 */
.scd{background:var(--s);border-radius:16px;border:1px solid var(--b);padding:16px;cursor:pointer;transition:all .18s}
.scd:hover{transform:translateY(-3px);box-shadow:0 8px 24px #5B4EE815;border-color:#C5C0F0}
.ext-scd{background:var(--s);border-radius:16px;border:1px solid var(--b);padding:14px;cursor:pointer;transition:all .18s}
.ext-scd:hover{transform:translateY(-3px);box-shadow:0 6px 20px #22C79A18}

/* 학생 설문 옵션 버튼 */
.opt-card{border-radius:16px;cursor:pointer;transition:all .15s;border:2.5px solid #e0dff0;background:#fff;text-align:left;font-weight:500;line-height:1.5}
.opt-card:hover{border-color:#a78bfa;background:#faf9ff;transform:translateY(-1px)}
.opt-card.selected{border-color:#7c3aed;background:linear-gradient(135deg,#f5f3ff,#ede9fe)}

/* 학생 학년/반 버튼 */
.grade-pill{border-radius:50px;cursor:pointer;transition:all .2s;border:2.5px solid #e0dff0;background:#fff;font-weight:700;font-size:18px}
.grade-pill:hover{transform:scale(1.08)}
.grade-pill.on{border-color:transparent;color:#fff;transform:scale(1.08);box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* 진행바 - 학생용 */
.progress-stu{height:12px;border-radius:50px;background:#e9e7f4;overflow:hidden;position:relative}
.progress-stu-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,#a78bfa,#7c3aed);transition:width .4s cubic-bezier(.34,1.56,.64,1);position:relative}
.progress-stu-fill::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #7c3aed60}

@media(max-width:640px){.sidebar{width:100%;height:auto;position:relative}.main{margin-left:0}.layout{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DM={U:{k:"다양성 이해",c:"#7C6FF7",bg:"#EEF0FF"},N:{k:"차이 존중",c:"#22C79A",bg:"#E3FAF4"},I:{k:"상호 소통",c:"#F27A50",bg:"#FEF0EB"},ON:{k:"공동체 실천",c:"#F5A623",bg:"#FEF5E3"}};
const DS=["U","N","I","ON"];
const TEACHERS=["담임교사","전담교사","한국어학급교사","돌봄교사","상담교사","외부기관"];
const LOG_TAGS=["다양성 그림책","멘토링","문화체험","상담","협동활동","기타"];
const LIKERT=["전혀 그렇지 않다","그렇지 않다","보통이다","그렇다","매우 그렇다"];
const GRADES=[1,2,3,4,5,6];
const CLASSES=[1,2];
const EXT_ORGS=["지역사회 복지관","다문화가족지원센터","교육청 Wee센터","청소년상담복지센터","이주민지원센터","기타 외부기관"];

const Q12=[
  {id:"q01",d:"U",text:"새 학기 자기소개 시간입니다. 친구들이 나는 이런 걸 좋아해요라고 이야기하고 있습니다. 나는 어떻게 할까요?",opts:["생각나는 것이 없어 짧게 말한다.","다른 친구들과 비슷하게 말한다.","내가 좋아하는 것이나 경험을 말한다.","나의 이야기와 내가 자라온 이야기도 함께 말한다."]},
  {id:"q02",d:"U",text:"친구들이 서로의 가족 이야기나 생활 이야기를 나누고 있습니다. 나와 다른 점이 많이 보입니다. 어떤 생각이 드나요?",opts:["나와 달라서 조금 어색하다.","그냥 다른 것 같다.","사람마다 다를 수 있다고 생각한다.","각자 다른 이야기가 있어 재미있다고 생각한다."]},
  {id:"q03",d:"U",text:"급식 시간에 친구들마다 먹는 음식이 조금씩 다릅니다. 어떤 친구는 특정 음식을 먹지 않습니다. 어떤 생각이 드나요?",opts:["왜 그런지 이해하기 어렵다.","나와 달라서 신기하다.","이유가 있을 것 같다.","살던 곳이나 먹는 방법이 달라서 그렇다고 생각한다."]},
  {id:"q04",d:"N",text:"체육 시간에 어떤 친구가 처음 해보는 놀이 방법 때문에 활동을 어려워하고 있습니다. 어떤 생각이 드나요?",opts:["왜 잘 못하는지 잘 모르겠다.","운동을 잘 못하는 것 같다고 생각한다.","익숙하지 않아서 그럴 수 있다고 생각한다.","다른 곳에서 배워서 우리 방법이 익숙하지 않을 수 있다고 생각한다."]},
  {id:"q05",d:"N",text:"발표 시간에 한 친구의 말이 조금 어색하게 들리고, 몇몇 친구들이 웃으려고 합니다. 나는 어떻게 할까요?",opts:["나도 웃는다.","그냥 가만히 있는다.","친구가 떨렸을 것 같다고 생각한다.","웃지 말자고 하거나 친구를 도와준다."]},
  {id:"q06",d:"I",text:"전학 온 친구가 쉬는 시간에 혼자 앉아 있습니다. 나는 어떻게 할까요?",opts:["그냥 지나간다.","다른 친구들이 먼저 가길 기다린다.","가서 간단히 말을 걸어본다.","함께 놀자고 하거나 친구들과 어울리게 돕는다."]},
  {id:"q07",d:"N",text:"모둠 활동에서 한 친구가 의견을 냈지만 다른 친구들이 잘 듣지 않습니다. 나는 어떻게 할까요?",opts:["그냥 넘어간다.","다른 친구 의견을 따른다.","그 친구 의견도 들어보자고 말한다.","모든 친구가 말할 수 있게 도와준다."]},
  {id:"q08",d:"ON",text:"활동에 잘 끼지 못하는 친구가 있습니다. 나는 어떻게 할까요?",opts:["신경 쓰지 않는다.","선생님이 해결해 주실 것이라 생각한다.","가끔 말을 건다.","친구들과 함께 할 방법을 생각한다."]},
  {id:"q09",d:"I",text:"짝 활동 중 친구가 설명을 잘 이해하지 못해 계속 물어봅니다. 나는 어떻게 할까요?",opts:["다른 친구에게 물어보라고 한다.","한 번만 설명한다.","친구가 알 때까지 다시 설명한다.","그림을 그려주거나 쉬운 말로 정성껏 알려준다."]},
  {id:"q10",d:"I",text:"새로운 친구와 활동을 하는데 말이 잘 통하지 않아 어색합니다. 나는 어떻게 할까요?",opts:["대화를 피하고 다른 곳으로 간다.","필요한 말만 한다.","천천히 말하며 친구의 말을 이해하려고 한다.","몸짓을 하거나 그림을 그려서 내 마음을 전한다."]},
  {id:"q11",d:"ON",text:"모둠 활동에서 한 친구가 참여하지 못하고 조용히 있습니다. 나는 어떻게 할까요?",opts:["그냥 둔다.","내가 맡은 일만 한다.","참여할 수 있도록 말을 건다.","친구가 함께할 일을 만들어 같이 한다."]},
  {id:"q12",d:"ON",text:"학교에서 다양한 문화를 소개하는 활동이 열립니다. 나는 어떻게 할까요?",opts:["참여하지 않는다.","친구들이 하면 따라 한다.","참여해본다.","재미있게 참여하고 친구들에게도 함께 하자고 말한다."]}
];
const Q36=[
  {id:"q01",d:"U",text:"나는 나의 모습과 나의 이야기를 소중하게 생각한다."},
  {id:"q02",d:"U",text:"나는 내가 학교, 집 등에서 경험한 일들이 나를 만드는 데 중요하다고 생각한다."},
  {id:"q03",d:"U",text:"나는 나를 설명할 때 나의 다양한 모습(좋아하는 것, 성격, 경험 등)을 떠올릴 수 있다."},
  {id:"q04",d:"U",text:"나는 나와 다른 모습을 가진 사람들도 각자의 이야기를 가지고 있다고 생각한다."},
  {id:"q05",d:"U",text:"세상에는 서로 다른 다양한 문화와 생활 방식이 있다는 것을 알고 있다."},
  {id:"q06",d:"U",text:"나와 다른 모습이나 생활 방식을 가진 사람들이 함께 살아가는 것은 자연스럽다고 생각한다."},
  {id:"q07",d:"U",text:"나는 다른 문화에 대해 배우는 것이 흥미롭고 재미있다."},
  {id:"q08",d:"U",text:"문화는 서로 다를 뿐, 어느 것이 더 좋거나 나쁘다고 생각하지 않는다."},
  {id:"q09",d:"N",text:"사람들은 어떤 나라나 모습에 대해 미리 정해진 생각(편견)을 가질 수 있다는 것을 알고 있다."},
  {id:"q10",d:"N",text:"친구가 말이나 생활 환경 때문에 어려움을 겪을 때 그 마음을 이해하려고 노력한다."},
  {id:"q11",d:"N",text:"외모나 말, 문화가 다르다는 이유로 놀리는 것은 잘못된 행동이라고 생각한다."},
  {id:"q12",d:"N",text:"새로운 환경에 있는 사람이 느낄 수 있는 불안함이나 외로움을 이해하려고 한다."},
  {id:"q13",d:"N",text:"모든 사람은 태어난 곳이나 배경과 상관없이 존중받아야 한다고 생각한다."},
  {id:"q14",d:"N",text:"우리 반 친구들은 모두 똑같이 누릴 수 있는 것과 지켜야 할 것이 있다고 생각한다."},
  {id:"q15",d:"N",text:"나는 나와 다른 생각을 가진 사람의 의견도 끝까지 들어보려고 한다."},
  {id:"q16",d:"N",text:"우리 사회의 규칙은 모든 사람에게 똑같이 공평하게 적용되어야 한다고 생각한다."},
  {id:"q17",d:"I",text:"나는 새로운 친구가 말을 걸어오면 반갑게 대답하려고 한다."},
  {id:"q18",d:"I",text:"말이 조금 다르거나 표현이 다른 사람의 이야기를 끝까지 들어보려고 한다."},
  {id:"q19",d:"I",text:"말이 잘 통하지 않을 때는 그림, 몸짓 등 다양한 방법으로 표현하려고 한다."},
  {id:"q20",d:"I",text:"다른 문화나 언어를 조금씩 배워보고 싶다."},
  {id:"q21",d:"ON",text:"나는 친구들과 함께 활동하는 것을 즐긴다."},
  {id:"q22",d:"ON",text:"친구가 어려움을 겪고 있을 때 함께 도와 해결하려고 한다."},
  {id:"q23",d:"ON",text:"다양한 문화 활동이나 행사에 참여해보고 싶다."},
  {id:"q24",d:"ON",text:"서로 다른 사람들이 함께하면 더 좋은 결과를 만들 수 있다고 생각한다."}
];
const getQs=g=>g<=2?Q12:Q36;
const gg=g=>g<=2?"1-2학년군":"3-6학년군";
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>new Date().toISOString().slice(0,10);
function calcSc(ans,gr){const qs=getQs(gr),mx=gr<=2?4:5,r={};DS.forEach(d=>{const dq=qs.filter(q=>q.d===d);r[d]=dq.length?Math.round(dq.reduce((a,q)=>a+(ans[q.id]||0),0)/(dq.length*mx)*100):0;});return r;}
const SK="union_v4",PW_KEY="union_pw_v1";
const loadSt=()=>{try{const d=localStorage.getItem(SK);return d?JSON.parse(d):defData();}catch(e){return defData();}};
const saveSt=l=>{try{localStorage.setItem(SK,JSON.stringify(l));}catch(e){}};
const getPw=()=>localStorage.getItem(PW_KEY)||"teacher1234";
const NK="union_notices_v1", PRK="union_programs_v1", RSK="union_resources_v1";
function loadNotices(){try{const d=localStorage.getItem(NK);return d?JSON.parse(d):defNotices();}catch(e){return defNotices();}}
function saveNotices(l){try{localStorage.setItem(NK,JSON.stringify(l));}catch(e){}}
function loadPrograms(){try{const d=localStorage.getItem(PRK);return d?JSON.parse(d):defPrograms();}catch(e){return defPrograms();}}
function savePrograms(l){try{localStorage.setItem(PRK,JSON.stringify(l));}catch(e){}}
function loadResources(){try{const d=localStorage.getItem(RSK);return d?JSON.parse(d):defResources();}catch(e){return defResources();}}
function saveResources(l){try{localStorage.setItem(RSK,JSON.stringify(l));}catch(e){}}
function defNotices(){return[
  {id:"n1",title:"2025년 UNION+ 다문화 역량 진단 안내",content:"3월부터 전교생 대상으로 UNION+ 다문화 역량 진단이 시작됩니다. 담임교사의 안내에 따라 설문에 참여해주세요.",date:"2025-03-01",important:true},
  {id:"n2",title:"다문화 음식 체험 행사 안내",content:"4월 15일(화) 점심시간에 다문화 음식 체험 부스가 운영됩니다. 관심 있는 학생 모두 참여 환영합니다!",date:"2025-04-10",important:false}
];}

// ── HTML 빌더 함수들 (문자열 연결, 백틱 중첩 없음) ────────
function hRadar(sc,sz,showScore){
  sz=sz||130;if(!sc)return"";
  const cx=sz/2,cy=sz/2,r=sz*.31,ag=[270,0,90,180].map(d=>d*Math.PI/180);
  const pts=DS.map((d,i)=>{const p=(sc[d]||0)/100;return[cx+Math.cos(ag[i])*r*p,cy+Math.sin(ag[i])*r*p];});
  let s='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" style="overflow:visible">';
  // 배경 격자
  [.25,.5,.6,.75,1].forEach(p=>{
    const gp=DS.map((_,i)=>[cx+Math.cos(ag[i])*r*p,cy+Math.sin(ag[i])*r*p]);
    const is60=Math.abs(p-.6)<.01, is75=Math.abs(p-.75)<.01;
    s+='<polygon points="'+gp.map(v=>v.join(",")).join(" ")+'" fill="'+(p===1?"#EEF0FF":is75?"#E3FAF420":is60?"#FFF8F020":"none")+'" stroke="'+(is60?"#F5A623":is75?"#22C79A":"#E0DEF0")+'" stroke-width="'+(is60||is75?1.5:p===1?1:.5)+'" stroke-dasharray="'+(is60||is75?"4,3":"")+'"/>';
  });
  DS.forEach((_,i)=>s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(ag[i])*r)+'" y2="'+(cy+Math.sin(ag[i])*r)+'" stroke="#D8D6EC" stroke-width=".7"/>');
  // 데이터 영역
  s+='<polygon points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="#7C6FF740" stroke="#7C6FF7" stroke-width="2" stroke-linejoin="round"/>';
  // 점 + 점수
  pts.forEach(([x,y],i)=>{
    const d=DS[i],v=sc[d]||0;
    const isLow=v<60,isHigh=v>=75;
    const dotColor=isLow?"#F5A623":isHigh?"#22C79A":"#7C6FF7";
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(sz>100?4:3)+'" fill="'+dotColor+'" stroke="#fff" stroke-width="1.5"/>';
    if(showScore&&sz>=120){
      // 점수 라벨 (점 바깥쪽에)
      const lx=cx+Math.cos(ag[i])*(r*(v/100)+18),ly=cy+Math.sin(ag[i])*(r*(v/100)+18);
      s+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" font-size="10" font-weight="800" fill="'+dotColor+'" font-family="inherit">'+v+'</text>';
    }
  });
  // 영역 라벨
  DS.forEach((d,i)=>{const lx=cx+Math.cos(ag[i])*(r+14),ly=cy+Math.sin(ag[i])*(r+14);s+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="central" font-size="'+(sz>100?9:7.5)+'" font-weight="700" fill="'+DM[d].c+'" font-family="inherit">'+d+'</text>';});
  return s+"</svg>";
}

function hGradeCls(selG,selC,pfx){let h='<div><label style="display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:7px">학년</label><div style="display:flex;gap:6px">';GRADES.forEach(g=>{const on=selG===g;h+='<button class="'+pfx+'gb" data-g="'+g+'" style="flex:1;padding:10px 0;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid '+(on?"var(--p)":"var(--b)")+';background:'+(on?"var(--p)":"var(--s)")+';color:'+(on?"#fff":"var(--m)")+'">'+g+'</button>';});h+='</div></div><div><label style="display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:7px">반</label><div style="display:flex;gap:8px">';CLASSES.forEach(c=>{const on=selC===c;h+='<button class="'+pfx+'cb" data-c="'+c+'" style="flex:1;padding:12px 0;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid '+(on?"var(--p)":"var(--b)")+';background:'+(on?"var(--p)":"var(--s)")+';color:'+(on?"#fff":"var(--m)")+'">'+(c)+'반</button>';});h+='</div></div>';return h;}

// ── 비교 차트: 우리 반 vs 학교 평균 ─────────────────────
function hCompareChart(myList, allList, myLabel){
  const myDone=myList.filter(s=>s.scores);
  const allDone=allList.filter(s=>s.scores);
  if(!myDone.length||!allDone.length)return'';

  const myAvg={}, allAvg={};
  DS.forEach(d=>{
    myAvg[d]=Math.round(myDone.reduce((a,s)=>a+s.scores[d],0)/myDone.length);
    allAvg[d]=Math.round(allDone.reduce((a,s)=>a+s.scores[d],0)/allDone.length);
  });

  const W=480, H=200;
  const PAD={t:20,r:20,b:40,l:44};
  const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;
  const n=DS.length;
  const groupW=cW/n, barW=Math.min(groupW*0.35,30), gap=4;

  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;overflow:visible">';

  // 격자 + Y축
  [0,25,50,60,75,100].forEach(v=>{
    const y=PAD.t+cH-(v/100*cH);
    const isKey=v===60||v===75;
    svg+='<line x1="'+PAD.l+'" y1="'+y+'" x2="'+(PAD.l+cW)+'" y2="'+y+'" stroke="'+(v===60?"#F5A623":v===75?"#22C79A":"#F0EEF8")+'" stroke-width="'+(isKey?1.5:.7)+'" stroke-dasharray="'+(isKey?"4,3":"")+'"/>';
    if(v%25===0||isKey)svg+='<text x="'+(PAD.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="'+(v===60?"#F5A623":v===75?"#22C79A":"#B0AECA")+'" font-family="inherit">'+v+'</text>';
  });

  // 막대 그룹
  DS.forEach((d,i)=>{
    const cx=PAD.l+i*groupW+groupW/2;
    const x1=cx-barW-gap/2, x2=cx+gap/2;

    const h1=Math.max(myAvg[d]/100*cH,2);
    const h2=Math.max(allAvg[d]/100*cH,2);
    const y1=PAD.t+cH-h1, y2=PAD.t+cH-h2;

    // 내 반 막대
    svg+='<rect x="'+x1+'" y="'+y1+'" width="'+barW+'" height="'+h1+'" rx="4" fill="'+DM[d].c+'" opacity="0.9"/>';
    svg+='<text x="'+(x1+barW/2)+'" y="'+(y1-5)+'" text-anchor="middle" font-size="10" font-weight="800" fill="'+DM[d].c+'" font-family="inherit">'+myAvg[d]+'</text>';

    // 학교 평균 막대 (연하게)
    svg+='<rect x="'+x2+'" y="'+y2+'" width="'+barW+'" height="'+h2+'" rx="4" fill="'+DM[d].c+'" opacity="0.3"/>';
    svg+='<text x="'+(x2+barW/2)+'" y="'+(y2-5)+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+DM[d].c+'" opacity="0.7" font-family="inherit">'+allAvg[d]+'</text>';

    // X축 라벨
    svg+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+DM[d].c+'" font-family="inherit">'+d+'</text>';

    // 차이 표시
    const diff=myAvg[d]-allAvg[d];
    if(diff!==0){
      const col=diff>0?"#22C79A":"var(--d)";
      const top=Math.min(y1,y2)-14;
      svg+='<text x="'+cx+'" y="'+top+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+col+'" font-family="inherit">'+(diff>0?"+":"")+diff+'</text>';
    }
  });

  svg+='</svg>';

  let legend='<div style="display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap">';
  legend+='<div style="display:flex;align-items:center;gap:6px"><div style="width:16px;height:12px;border-radius:3px;background:var(--p);opacity:.9"></div><span style="font-size:11px;font-weight:700;color:var(--t)">'+(myLabel||"내 반")+'</span></div>';
  legend+='<div style="display:flex;align-items:center;gap:6px"><div style="width:16px;height:12px;border-radius:3px;background:var(--p);opacity:.3"></div><span style="font-size:11px;color:var(--m)">학교 전체 평균</span></div>';
  legend+='</div>';

  return '<div class="card" style="margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:4px">📊 학교 전체 대비 비교</div>'
    +'<div style="font-size:11px;color:var(--m);margin-bottom:12px">'+(myLabel||"내 반")+'(진단완료 '+myDone.length+'명) vs 학교 전체('+allDone.length+'명) · 숫자 위 차이값 표시</div>'
    +svg+legend+'</div>';
}

function hFreq(list,title){
  const done=list.filter(s=>s.scores);
  if(!done.length)return'<div style="text-align:center;padding:30px;color:var(--m);font-size:13px">진단 완료 학생이 없어요.</div>';
  const BINS=[{l:"0-19",min:0,max:19},{l:"20-39",min:20,max:39},{l:"40-59",min:40,max:59},{l:"60-74",min:60,max:74},{l:"75-89",min:75,max:89},{l:"90-100",min:90,max:100}];
  const freq={};
  DS.forEach(d=>{freq[d]=BINS.map(b=>{const m=done.filter(s=>s.scores[d]>=b.min&&s.scores[d]<=b.max);return{...b,count:m.length,names:m.map(s=>s.name)};});});
  const maxC=Math.max(1,...DS.flatMap(d=>freq[d].map(b=>b.count)));
  const avg={};DS.forEach(d=>{avg[d]=Math.round(done.reduce((a,s)=>a+s.scores[d],0)/done.length);});
  const BH=80;

  let h='<div class="card" style="margin-bottom:14px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
  h+='<div><div style="font-size:13px;font-weight:700">'+(title||"UNION 영역별 점수 분포")+'</div>';
  h+='<div style="font-size:11px;color:var(--m);margin-top:2px">진단 완료 <strong>'+done.length+'명</strong> 기준 · <span style="color:#F5A623">━ 60점</span> <span style="color:#22C79A;margin-left:6px">━ 75점</span> 기준선</div></div>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
  DS.forEach(d=>h+='<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:'+DM[d].c+'"></div><span style="font-size:10px;font-weight:700;color:'+DM[d].c+'">'+d+' 평균 '+avg[d]+'점</span></div>');
  h+='</div></div>';

  // 영역별 막대 그래프 (SVG로 기준선 포함)
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px">';
  DS.forEach(d=>{
    const W=200,H=BH+50,PL=8,PR=8,PT=24,PB=28;
    const cW=W-PL-PR, cH=H-PT-PB;
    const n=BINS.length, bW=Math.floor(cW/n)-4;
    const y60=PT+cH-(60/100*cH);
    const y75=PT+cH-(75/100*cH);

    h+='<div style="background:var(--bg);border-radius:12px;padding:12px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<span style="font-size:11px;font-weight:700;color:'+DM[d].c+'">'+d+' '+DM[d].k+'</span>';
    h+='<span style="font-size:12px;font-weight:800;color:'+DM[d].c+';background:'+DM[d].bg+';padding:2px 8px;border-radius:20px">평균 '+avg[d]+'점</span></div>';

    let svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="overflow:visible">';
    // 60점 기준선
    svg+='<line x1="'+PL+'" y1="'+y60+'" x2="'+(W-PR)+'" y2="'+y60+'" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="4,3"/>';
    svg+='<text x="'+(W-PR+2)+'" y="'+(y60+4)+'" font-size="8" fill="#F5A623" font-family="inherit">60</text>';
    // 75점 기준선
    svg+='<line x1="'+PL+'" y1="'+y75+'" x2="'+(W-PR)+'" y2="'+y75+'" stroke="#22C79A" stroke-width="1.5" stroke-dasharray="4,3"/>';
    svg+='<text x="'+(W-PR+2)+'" y="'+(y75+4)+'" font-size="8" fill="#22C79A" font-family="inherit">75</text>';

    BINS.forEach((b,i)=>{
      const bh_ratio=freq[d][i].count/maxC;
      const bh=Math.max(bh_ratio*cH,freq[d][i].count>0?4:0);
      const x=PL+i*(cW/n)+2;
      const y=PT+cH-bh;
      const isSupport=b.max<60, isGood=b.min>=75;
      const color=isSupport?"#F5A623":isGood?"#22C79A":DM[d].c;
      if(freq[d][i].count>0){
        // 막대
        svg+='<rect x="'+x+'" y="'+y+'" width="'+bW+'" height="'+bh+'" rx="3" fill="'+color+'" opacity="0.85"/>';
        // 인원수
        svg+='<text x="'+(x+bW/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10" font-weight="800" fill="'+color+'" font-family="inherit">'+freq[d][i].count+'명</text>';
        // 학생 이름 (3명 이하면 항상 표시)
        if(freq[d][i].count<=3){
          freq[d][i].names.forEach((name,ni)=>{
            svg+='<text x="'+(x+bW/2)+'" y="'+(y-16-ni*11)+'" text-anchor="middle" font-size="8" fill="'+color+'" font-family="inherit">'+name+'</text>';
          });
        }
      } else {
        svg+='<rect x="'+x+'" y="'+(PT+cH-2)+'" width="'+bW+'" height="2" rx="1" fill="#E8E6F4"/>';
      }
      // X축 라벨
      svg+='<text x="'+(x+bW/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="#AAA8C0" font-family="inherit">'+b.l+'</text>';
    });
    svg+='</svg>';
    h+=svg+'</div>';
  });
  h+='</div>';

  // 상세 테이블
  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">';
  h+='<thead><tr style="border-bottom:1.5px solid var(--b)"><th style="text-align:left;padding:6px 8px;color:var(--m);font-weight:600">점수 구간</th>';
  DS.forEach(d=>h+='<th style="text-align:center;padding:6px 8px;color:'+DM[d].c+';font-weight:700">'+d+'</th>');
  h+='</tr></thead><tbody>';
  BINS.forEach((b,i)=>{
    const isSupport=b.max<60,isGood=b.min>=75;
    h+='<tr style="border-bottom:1px solid var(--b);background:'+(isSupport?"#FFF8F0":isGood?"#F0FFF8":"transparent")+'">';
    h+='<td style="padding:6px 8px;font-weight:600;color:var(--t)">'+b.l+'점'+(isSupport?' <span style="font-size:9px;color:#F5A623;background:#FFF3D0;padding:1px 5px;border-radius:3px">지원</span>':'')+(isGood?' <span style="font-size:9px;color:#22C79A;background:#E3FAF4;padding:1px 5px;border-radius:3px">우수</span>':'')+'</td>';
    DS.forEach(d=>{
      const bn=freq[d][i];
      const pct=done.length>0?Math.round(bn.count/done.length*100):0;
      h+='<td style="text-align:center;padding:6px 8px">';
      if(bn.count>0){
        h+='<div style="font-weight:700;color:'+DM[d].c+'">'+bn.count+'명</div>';
        h+='<div style="font-size:9px;color:var(--m)">('+pct+'%)</div>';
        // 4명 이상이면 이름 툴팁
        if(bn.count<=6)h+='<div style="font-size:9px;color:var(--m);max-width:100px;word-break:keep-all">'+bn.names.join(', ')+'</div>';
      } else {
        h+='<span style="color:var(--b)">-</span>';
      }
      h+='</td>';
    });
    h+='</tr>';
  });
  h+='<tr style="border-top:1.5px solid var(--b);background:var(--bg)"><td style="padding:6px 8px;font-weight:700">합계</td>';
  DS.forEach(d=>h+='<td style="text-align:center;padding:6px 8px;font-weight:700;color:'+DM[d].c+'">'+done.length+'명</td>');
  h+='</tr></tbody></table></div>';

  // 지원 필요 요약
  const ns={};DS.forEach(d=>{const s2=done.filter(s=>s.scores[d]<60);if(s2.length)ns[d]=s2.map(s=>s.name);});
  if(Object.keys(ns).length===0){
    h+='<div style="margin-top:12px;padding:10px 14px;border-radius:10px;background:#E3FAF4;font-size:12px;color:#085041;font-weight:600">🌟 모든 영역 60점 이상! 집중 지원이 필요한 학생이 없어요.</div>';
  } else {
    h+='<div style="margin-top:12px;padding:12px 14px;border-radius:10px;background:#FFF8F0;border:1px solid #F5A62340">';
    h+='<div style="font-size:11px;font-weight:700;color:#BA7517;margin-bottom:8px">⚠ 60점 미만 · 집중 지원 필요 학생</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
    Object.entries(ns).forEach(([d,names])=>{
      h+='<div style="background:var(--s);border-radius:8px;padding:6px 12px;border:1px solid var(--b)">';
      h+='<span style="font-size:10px;font-weight:700;color:'+DM[d].c+';margin-right:6px">'+d+'+</span>';
      h+='<span style="font-size:11px">'+names.join(', ')+'</span></div>';
    });
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}

function hTimeline(logs,extOrg){if(!logs.length)return'<div style="text-align:center;padding:16px 0;color:var(--m);font-size:12px">아직 기록이 없어요</div>';let h="";logs.forEach((log,i)=>{const isExt=extOrg&&(log.author===extOrg||log.author.includes(extOrg));const dot=isExt?"#22C79A":"var(--p)";const bb=isExt?"#E3FAF4":"var(--pl)";const bc=isExt?"#085041":"var(--p)";h+='<div style="display:flex;gap:10px;margin-bottom:'+(i<logs.length-1?13:0)+'px"><div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0"><div style="width:7px;height:7px;border-radius:50%;background:'+dot+';margin-top:3px"></div>'+(i<logs.length-1?'<div style="width:1.5px;flex:1;background:var(--b);margin-top:3px"></div>':"")+'</div><div style="flex:1;padding-bottom:3px"><div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px"><span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:'+bb+';color:'+bc+'">'+log.author+'</span>';log.tags.forEach(tg=>h+='<span style="font-size:10px;color:#F27A50;background:#FEF0EB;padding:2px 6px;border-radius:4px">'+tg+'</span>');h+='<span style="font-size:10px;color:var(--m);margin-left:auto">'+log.date+'</span></div><div style="font-size:12px;color:var(--t);line-height:1.65;background:var(--bg);border-radius:7px;padding:7px 10px">'+log.memo+'</div></div></div>';});return h;}

// ── 성장 추이 차트 ────────────────────────────────────────
function hGrowthChart(scoreHistory){
  if(!scoreHistory||scoreHistory.length<1)return'';

  // 1회만 있어도 레이더로 시각화
  if(scoreHistory.length===1){
    const sc=scoreHistory[0].scores;
    return '<div style="background:var(--bg);border-radius:12px;padding:16px">'
      +'<div style="font-size:12px;color:var(--m);text-align:center;margin-bottom:12px">현재 진단 결과 · 재진단하면 성장 그래프가 나타나요 📈</div>'
      +'<div style="display:flex;justify-content:center">'+hRadar(sc,160,true)+'</div>'
      +'</div>';
  }

  const n=scoreHistory.length;
  const W=500, H=220;
  const PAD={t:30,r:60,b:44,l:44};
  const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;
  const xStep=cW/(n-1||1);
  const yScale=v=>cH-(v/100*cH);
  const colors={U:"#7C6FF7",N:"#22C79A",I:"#F27A50",ON:"#F5A623"};

  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">';

  // 배경 채우기 (60점 미만 = 연한 주황, 75점 이상 = 연한 초록)
  const y60=PAD.t+yScale(60), y75=PAD.t+yScale(75), y0=PAD.t+cH, y100=PAD.t;
  svg+='<rect x="'+PAD.l+'" y="'+y0+'" width="'+cW+'" height="'+(y0-y60)+'" fill="#FFF8F010"/>';
  svg+='<rect x="'+PAD.l+'" y="'+y75+'" width="'+cW+'" height="'+(y75-y100)+'" fill="#E3FAF415"/>';

  // 격자선 + Y축 라벨
  [0,20,40,60,75,100].forEach(v=>{
    const y=PAD.t+yScale(v);
    const is60=v===60, is75=v===75;
    svg+='<line x1="'+PAD.l+'" y1="'+y+'" x2="'+(PAD.l+cW)+'" y2="'+y+'" stroke="'+(is60?"#F5A623":is75?"#22C79A":"#E8E6F4")+'" stroke-width="'+(is60||is75?1.5:.8)+'" stroke-dasharray="'+(is60||is75?"5,3":"")+'"/>';
    svg+='<text x="'+(PAD.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="'+(is60?"#F5A623":is75?"#22C79A":"#B0AECA")+'" font-weight="'+(is60||is75?700:400)+'" font-family="inherit">'+v+'</text>';
    if(is60)svg+='<text x="'+(PAD.l+cW+4)+'" y="'+(y+4)+'" font-size="8" fill="#F5A623" font-family="inherit">지원</text>';
    if(is75)svg+='<text x="'+(PAD.l+cW+4)+'" y="'+(y+4)+'" font-size="8" fill="#22C79A" font-family="inherit">우수</text>';
  });

  // 영역별 선 + 점 + 값
  DS.forEach(d=>{
    const c=colors[d];
    const pts=scoreHistory.map((h,i)=>[PAD.l+i*xStep, PAD.t+yScale(h.scores[d])]);

    // 그림자 효과를 위한 두꺼운 흰 선
    svg+='<polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>';
    // 실제 선
    svg+='<polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';

    // 각 점
    pts.forEach(([x,y],i)=>{
      const v=scoreHistory[i].scores[d];
      const isLast=i===pts.length-1;
      svg+='<circle cx="'+x+'" cy="'+y+'" r="'+(isLast?6:5)+'" fill="'+(isLast?c:"white")+'" stroke="'+c+'" stroke-width="2.5"/>';
      if(isLast){
        // 마지막 값은 오른쪽에 항상 표시
        svg+='<text x="'+(x+10)+'" y="'+(y+4)+'" font-size="11" font-weight="800" fill="'+c+'" font-family="inherit">'+v+'</text>';
      } else {
        // 중간 값은 위에 작게
        svg+='<text x="'+x+'" y="'+(y-9)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+c+'" font-family="inherit">'+v+'</text>';
      }
    });
  });

  // X축 날짜 라벨
  scoreHistory.forEach((h,i)=>{
    const x=PAD.l+i*xStep;
    const label=h.date.slice(5).replace('-','/');
    svg+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#8884AA" font-family="inherit">'+label+'</text>';
    svg+='<line x1="'+x+'" y1="'+(PAD.t+cH+4)+'" x2="'+x+'" y2="'+(PAD.t+cH+8)+'" stroke="#C8C6E0" stroke-width="1"/>';
  });

  svg+='</svg>';

  // 범례 (가로 정렬)
  let legend='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;justify-content:center">';
  DS.forEach(d=>legend+='<div style="display:flex;align-items:center;gap:5px"><div style="width:24px;height:3px;border-radius:2px;background:'+colors[d]+'"></div><div style="width:8px;height:8px;border-radius:50%;background:'+colors[d]+'"></div><span style="font-size:11px;color:'+colors[d]+';font-weight:700">'+d+' '+DM[d].k+'</span></div>');
  legend+='</div>';

  // 변화량 요약 카드
  const first=scoreHistory[0].scores, last=scoreHistory[scoreHistory.length-1].scores;
  let changes='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px">';
  DS.forEach(d=>{
    const diff=last[d]-first[d];
    const arrow=diff>0?"↑":diff<0?"↓":"─";
    const col=diff>0?"#22C79A":diff<0?"var(--d)":"var(--m)";
    const bg=diff>0?"#E3FAF4":diff<0?"#FFF0F3":"var(--bg)";
    changes+='<div style="background:'+bg+';border-radius:10px;padding:10px;text-align:center">';
    changes+='<div style="font-size:10px;font-weight:700;color:'+DM[d].c+';margin-bottom:4px">'+d+'</div>';
    changes+='<div style="font-size:20px;font-weight:900;color:'+col+';line-height:1">'+arrow+(diff!==0?Math.abs(diff):'')+'</div>';
    changes+='<div style="font-size:9px;color:var(--m);margin-top:3px">'+first[d]+' → <strong style="color:'+col+'">'+last[d]+'</strong></div>';
    changes+='</div>';
  });
  changes+='</div>';

  return '<div style="background:var(--bg);border-radius:12px;padding:16px">'+svg+legend+changes+'</div>';
}

function hLogInput(lAuth,lTags,lMemo,accent){accent=accent||"var(--p)";let h='<div style="background:var(--bg);border-radius:9px;padding:13px;margin-bottom:13px"><div style="font-size:10px;font-weight:600;color:var(--m);margin-bottom:5px">기록 주체</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">';TEACHERS.forEach(t=>{const on=lAuth===t;h+='<button class="la" data-a="'+t+'" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid '+(on?accent:"var(--b)")+';background:'+(on?accent:"var(--s)")+';color:'+(on?"#fff":"var(--m)")+'">'+t+'</button>';});h+='</div><div style="font-size:10px;font-weight:600;color:var(--m);margin-bottom:5px">활동 태그</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">';LOG_TAGS.forEach(t=>{const on=lTags.includes(t);h+='<button class="lt" data-t="'+t+'" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid '+(on?"#F27A50":"var(--b)")+';background:'+(on?"#FEF0EB":"var(--s)")+';color:'+(on?"#F27A50":"var(--m)")+'">'+(on?"✓ ":"")+t+'</button>';});h+='</div><textarea id="log-memo" rows="3" placeholder="활동 내용이나 관찰 사항을 자유롭게 기록하세요..." style="width:100%;padding:9px 11px;border-radius:8px;border:1.5px solid var(--b);background:var(--s);outline:none;color:var(--t);resize:vertical;line-height:1.6">'+lMemo+'</textarea><button id="btn-log-save" style="margin-top:8px;width:100%;padding:9px 0;border-radius:8px;background:'+accent+';color:#fff;border:none;font-weight:700;cursor:pointer">기록 저장</button></div>';return h;}

    // 교사용에도 이전 대비 변화
    const hist3=s.scoreHistory||[];
    if(hist3.length>=2){const prev3=hist3[hist3.length-2].scores;body+='<div class="card" style="margin-bottom:9px"><div style="font-size:12px;font-weight:700;margin-bottom:10px;color:var(--m)">📈 이전 진단 대비 변화</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';DS.forEach(d=>{const diff=s.scores[d]-prev3[d];const arrow=diff>0?"↑":diff<0?"↓":"→";const col=diff>0?"#22C79A":diff<0?"var(--d)":"var(--m)";body+='<div style="background:'+DM[d].bg+';border-radius:10px;padding:8px;text-align:center"><div style="font-size:10px;font-weight:700;color:'+DM[d].c+';margin-bottom:3px">'+d+'</div><div style="font-size:18px;font-weight:800;color:'+col+'">'+arrow+(diff!==0?Math.abs(diff):"")+'</div><div style="font-size:9px;color:'+DM[d].c+';margin-top:1px">'+prev3[d]+'→'+s.scores[d]+'</div></div>';});body+='</div></div>';}
    body+='<button id="btn-result-done" class="btn-p" style="box-shadow:0 4px 12px #5B4EE830">학생 페이지로 →</button></div>';
  }
  return isT?hLayout(tcSidebar(),body):body;
}


// ── 지원 프로그램 관리 ────────────────────────────────────
function pgSupport(){
  const{students:sl,programs:progs}=S;
  const done=sl.filter(s=>s.scores);
  // 영역별 60점 미만 학생
  const needSupport={};
  DS.forEach(d=>{const ns=done.filter(s=>s.scores[d]<60);if(ns.length)needSupport[d]=ns;});

  let body=hTopbar("지원 프로그램 관리",false);
  body+='<div style="padding:16px 20px;max-width:900px">';

  // 요약 카드
  const totalNeed=new Set(Object.values(needSupport).flat().map(s=>s.id)).size;
  body+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">';
  body+='<div class="card" style="padding:14px;text-align:center"><div style="font-size:28px;font-weight:800;color:var(--d)">'+totalNeed+'</div><div style="font-size:11px;color:var(--m);margin-top:2px">지원 필요 학생</div></div>';
  DS.forEach(d=>{const cnt=(needSupport[d]||[]).length;body+='<div class="card" style="padding:14px;text-align:center;border-left:4px solid '+DM[d].c+'"><div style="font-size:24px;font-weight:800;color:'+DM[d].c+'">'+cnt+'</div><div style="font-size:11px;color:var(--m);margin-top:2px">'+d+' 지원 필요</div></div>';});
  body+='</div>';

  // 영역별 지원 필요 학생
  if(Object.keys(needSupport).length===0){
    body+='<div class="card" style="padding:40px;text-align:center;color:var(--m)">🌟 모든 학생이 60점 이상이에요! 지원 프로그램 연결이 필요한 학생이 없어요.</div>';
  } else {
    body+='<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">';
    DS.forEach(d=>{
      const ns=needSupport[d]||[];
      if(!ns.length)return;
      const prog=progs.find(p=>p.domain===d);
      body+='<div class="card" style="border-left:4px solid '+DM[d].c+'">';
      body+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">';
      body+='<div><div style="font-size:13px;font-weight:700;color:'+DM[d].c+'">'+d+' · '+DM[d].k+' 지원 필요 ('+ns.length+'명)</div>';
      if(prog)body+='<div style="font-size:11px;color:var(--m);margin-top:2px">추천: '+prog.name+' ('+prog.sessions+'회기)</div>';
      body+='</div>';
      if(prog)body+='<span style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:'+DM[d].bg+';color:'+DM[d].c+'">'+prog.sessions+'회기</span>';
      body+='</div>';
      body+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
      ns.forEach(s=>{
        body+='<div style="background:var(--bg);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px">';
        body+='<div style="width:30px;height:30px;border-radius:50%;background:'+DM[d].bg+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:'+DM[d].c+'">'+s.name[0]+'</div>';
        body+='<div><div style="font-size:12px;font-weight:600">'+s.name+'</div>';
        body+='<div style="font-size:10px;color:var(--m)">'+d+'영역 <strong style="color:'+DM[d].c+'">'+s.scores[d]+'점</strong></div></div></div>';
      });
      body+='</div></div>';
    });
    body+='</div>';
  }

  // 프로그램 목록
  body+='<div style="font-size:14px;font-weight:700;margin-bottom:12px">📋 지원 프로그램 목록</div>';
  body+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">';
  progs.forEach(p=>{
    const enrolled=done.filter(s=>s.scores&&s.scores[p.domain]<p.target).length;
    body+='<div class="card" style="border-top:4px solid '+p.color+'">';
    body+='<div style="font-size:13px;font-weight:700;margin-bottom:6px">'+p.name+'</div>';
    body+='<div style="font-size:11px;color:var(--m);margin-bottom:8px;line-height:1.6">'+p.desc+'</div>';
    body+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--m);padding-top:8px;border-top:1px solid var(--b)">';
    body+='<span>대상 기준: '+p.domain+' <strong style="color:'+p.color+'">'+p.target+'점 미만</strong></span>';
    body+='<span>대상 '+enrolled+'명 · '+p.sessions+'회기</span></div></div>';
  });
  body+='</div></div>';
  return hLayout(tcSidebar(),body);
}

function updCC(){const ta=document.getElementById("neis-draft"),cc=document.getElementById("char-count");if(ta&&cc)cc.textContent=ta.value.length+"자";}
function showAiErr(msg){const el=document.getElementById("ai-error"),ld=document.getElementById("ai-loading");if(el){el.style.display="block";el.textContent="⚠ "+msg;}if(ld)ld.style.display="none";}
async function genNeis(s){
  const key=S.apiKey.trim();
  if(!key){showAiErr("API 키를 먼저 입력하고 저장해주세요.");return;}
  if(!s.scores){showAiErr("진단 설문을 먼저 완료해야 해요.");return;}
  const ld=document.getElementById("ai-loading"),rw=document.getElementById("ai-result-wrap"),er=document.getElementById("ai-error"),btn=document.getElementById("btn-ai-gen");
  if(ld)ld.style.display="block";if(rw)rw.style.display="none";if(er)er.style.display="none";if(btn)btn.disabled=true;
  const dd={U:"다양성 이해",N:"차이 존중",I:"상호 소통",ON:"공동체 실천"};
  const sLines=DS.map(d=>"  - "+d+"("+dd[d]+"): "+s.scores[d]+"점").join("\n");
  const sorted2=Object.entries(s.scores).sort(([,a],[,b])=>b-a);
  const logLines=s.logs.length?s.logs.map(l=>"  ["+l.date+"] "+l.author+" / "+l.tags.join(",")+"  "+l.memo).join("\n"):"  (기록 없음)";
  const prompt="당신은 초등학교 담임교사입니다. 아래 학생의 다문화 역량 진단 결과와 교사 관찰 기록을 바탕으로 NEIS 학교생활기록부 종합의견 초안을 작성해주세요.\n\n[학생 정보]\n- 이름: "+s.name+"\n- 학년: "+s.grade+"학년 "+s.cls+"반\n- 담임: "+(s.teacher||"미지정")+"\n\n[UNION 역량 진단 결과]\n"+sLines+"\n- 강점: "+sorted2[0][0]+"("+dd[sorted2[0][0]]+")\n- 지원필요: "+sorted2[sorted2.length-1][0]+"("+dd[sorted2[sorted2.length-1][0]]+")\n\n[교사 기록]\n"+logLines+"\n\n[작성 지침]\n1. 분량: "+S.neisCh+"자 내외\n2. NEIS 종합의견 문체(3인칭)\n3. 강점 먼저, 지원 필요 영역은 성장 가능성 중심\n4. 구체적 활동 사례 포함\n5. 다문화, UNION, 점수 표현 금지\n6. 마지막 문장은 성장 기대로 마무리\n7. 초안만 출력";
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,messages:[{role:"user",content:prompt}]})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error((e.error&&e.error.message)||"API 오류 ("+res.status+")");}
    const data=await res.json();
    const text=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("")||"";
    S.neisText=text.trim();
    if(ld)ld.style.display="none";if(rw)rw.style.display="block";
    const ta=document.getElementById("neis-draft");if(ta){ta.value=S.neisText;updCC();}
  }catch(e){if(ld)ld.style.display="none";showAiErr(e.message||"오류가 발생했어요.");}
  finally{if(btn)btn.disabled=false;}
}

  else if(page==="tcEnter")   h=pgTcEnter();
  else if(page==="extEnter")  h=pgExtEnter();
  else if(page==="teacher"){
    if(menu==="survey")        h=pgSurveyList();
    else if(menu==="classView")     h=pgClassView();
    else if(menu==="schoolView")    h=pgSchoolView();
    else if(menu==="support")       h=pgSupport();
    else if(menu==="notice")        h=pgNotice();
    else if(menu==="resource")      h=pgResource();
    else if(menu==="settings")      h=pgSettings();
    else if(menu==="detail")        h=pgDetail();
    else if(menu==="formAdd")       h=pgForm("add");

    else if(menu==="svStart")       h=pgSvStart();
    else if(menu==="surveyProg")    h=pgSurvey();
    else if(menu==="result")        h=pgResult();
  }
  else if(page==="student"){
    if(menu==="svStart")       h=pgSvStart();
    else if(menu==="surveyProg")    h=pgSurvey();
    else if(menu==="result")        h=pgResult();
  }
  else if(page==="external"){
    if(menu==="ext_students")       h=pgExtStudents();

    onA(".la",e=>set({lAuth:e.target.dataset.a}));
    onA(".lt",e=>{const t=e.target.dataset.t;set({lTags:S.lTags.includes(t)?S.lTags.filter(x=>x!==t):[...S.lTags,t]});});
    const lm=document.getElementById("log-memo");if(lm){lm.value=S.lMemo;lm.addEventListener("input",()=>{S.lMemo=lm.value;});}
    on("btn-log-save",()=>{const lme=document.getElementById("log-memo");const memo=lme?lme.value.trim():"";if(!memo){toast("내용을 입력해주세요.");return;}const lg={id:uid(),date:td(),author:S.lAuth,tags:[...S.lTags],memo};set({students:S.students.map(x=>x.id===sid?{...x,logs:[lg,...x.logs]}:x),lMemo:"",lTags:[]});toast("기록이 저장되었습니다.");});
    const ki=document.getElementById("api-key-input");if(ki)ki.value=S.apiKey||"";
    on("btn-key-save",()=>{const ki2=document.getElementById("api-key-input");const k=ki2?ki2.value.trim():"";S.apiKey=k;localStorage.setItem("union_api_key",k);const st=document.getElementById("key-status");if(st)st.textContent=k?"✅ API 키가 저장됐어요.":"⚠ API 키를 입력해주세요.";});
    onA(".char-opt",e=>{S.neisCh=Number(e.target.dataset.n);document.querySelectorAll(".char-opt").forEach(b=>{const a=Number(b.dataset.n)===S.neisCh;b.style.border="1.5px solid "+(a?"var(--p)":"var(--b)");b.style.background=a?"var(--p)":"var(--s)";b.style.color=a?"#fff":"var(--m)";});});
    on("btn-ai-gen",()=>{const s2=S.students.find(x=>x.id===sid);if(s2)genNeis(s2);});
    const ta=document.getElementById("neis-draft");if(ta){ta.addEventListener("input",()=>{S.neisText=ta.value;updCC();});updCC();}
    on("btn-neis-copy",()=>{const ta2=document.getElementById("neis-draft");const t=ta2?ta2.value:"";navigator.clipboard.writeText(t).then(()=>toast("복사됐어요.")).catch(()=>toast("직접 선택해서 복사해주세요."));});
    on("btn-neis-save",()=>{const ta3=document.getElementById("neis-draft");const t=ta3?ta3.value.trim():"";if(!t)return;const lg={id:uid(),date:td(),author:"AI 초안(종합의견)",tags:["NEIS 종합의견"],memo:"[AI 생성 초안]\n"+t};set({students:S.students.map(x=>x.id===sid?{...x,logs:[lg,...x.logs]}:x)});toast("종합의견 초안이 저장됐어요.");});
  }

  // ── 설문 시작 ──
  if(menu==="svStart"){
    on("bk",()=>{if(page==="student")set({page:"stuEnter"});else set({menu:"detail"});});
    on("btn-sv-go",()=>set({menu:"surveyProg",sAns:{},sQ:0}));
    on("btn-sv-cx",()=>{if(page==="student")set({page:"stuEnter"});else set({menu:"detail"});});
  }

  // ── 설문 진행 ──
  if(menu==="surveyProg"){
    on("bk",()=>set({menu:"svStart"}));
    const s=students.find(x=>x.id===sid),qs=s?getQs(s.grade):[];
    onA(".ob",e=>{const val=Number(e.target.closest("[data-val]").dataset.val);const q=qs[cq];const na={...ans,[q.id]:val};if(cq<qs.length-1)set({sAns:na,sQ:cq+1});else set({sAns:na});});
    on("btn-prev",()=>{if(cq>0)set({sQ:cq-1});});
    on("btn-next",()=>{if(ans[qs[cq].id]!=null&&cq<qs.length-1)set({sQ:cq+1});});
    on("btn-submit",()=>{if(qs.every(q=>ans[q.id]!=null)){const scores=calcSc(ans,s.grade);const newEntry={date:td(),scores};set({students:S.students.map(x=>{if(x.id!==sid)return x;const hist=x.scoreHistory||[];return{...x,scores,scoreHistory:[...hist,newEntry]};}),menu:"result"});toast("진단이 완료되었습니다!");}});
    onA(".qd",e=>set({sQ:Number(e.target.dataset.i)}));
  }

  // ── 결과 ──
  if(menu==="result"){on("btn-result-done",()=>{if(page==="student")set({page:"login",role:null,sid:null,sAns:{},sQ:0,menu:"survey"});else set({menu:"detail"});});}

  // ── 지원 프로그램 (이벤트 없음, 표시만) ──

  // ── 공지사항 ──
  if(page==="teacher"&&menu==="notice"){
    const toggleForm=()=>{const w=document.getElementById("notice-form-wrap");if(w)w.style.display=w.style.display==="none"?"block":"none";};
    on("btn-add-notice",toggleForm);
    on("btn-notice-cancel",toggleForm);
    on("btn-notice-save",()=>{
      const t=document.getElementById("notice-title");const c=document.getElementById("notice-content");const imp=document.getElementById("notice-important");
      const title=t?t.value.trim():"";const content=c?c.value.trim():"";
      if(!title||!content){toast("제목과 내용을 입력해주세요.");return;}
      const newNotice={id:uid(),title,content,date:td(),important:imp?imp.checked:false};
      S.notices=[newNotice,...S.notices];saveNotices(S.notices);
      set({});toast("공지사항이 등록되었습니다.");
    });
    document.querySelectorAll(".btn-del-notice").forEach(b=>{b.addEventListener("click",()=>{if(confirm("공지사항을 삭제할까요?")){S.notices=S.notices.filter(n=>n.id!==b.dataset.id);saveNotices(S.notices);set({});toast("삭제되었습니다.");}});});
  }

  // ── 자료실 ──
  if(page==="teacher"&&menu==="resource"){
    const toggleResForm=()=>{const w=document.getElementById("res-form-wrap");if(w)w.style.display=w.style.display==="none"?"block":"none";};
    on("btn-add-res",toggleResForm);
    on("btn-res-cancel",toggleResForm);
    on("btn-res-save",()=>{
      const t=document.getElementById("res-title"),u=document.getElementById("res-url"),d=document.getElementById("res-desc"),c=document.getElementById("res-category");
      const title=t?t.value.trim():"",url=u?u.value.trim():"",desc=d?d.value.trim():"",category=c?c.value.trim():"자료";
      if(!title||!url){toast("제목과 URL을 입력해주세요.");return;}
      const newRes={id:uid(),title,url,desc,category,type:"link"};
      S.resources=[newRes,...S.resources];saveResources(S.resources);
      set({});toast("자료가 추가되었습니다.");
    });
    document.querySelectorAll(".btn-del-res").forEach(b=>{b.addEventListener("click",()=>{if(confirm("자료를 삭제할까요?")){S.resources=S.resources.filter(r=>r.id!==b.dataset.id);saveResources(S.resources);set({});toast("삭제되었습니다.");}});});
  }

  // ── 설정 ──
  if(page==="teacher"&&menu==="settings"){
    // 학년도 선택
    document.querySelectorAll(".year-btn").forEach(b=>{b.addEventListener("click",()=>{S.schoolYear=b.dataset.y;localStorage.setItem("union_year",b.dataset.y);set({});toast(b.dataset.y+"년도로 변경됐어요.");});});
    // 비밀번호 변경
    on("btn-pw-change",()=>{
      const o=document.getElementById("pw-old"),n1=document.getElementById("pw-new1"),n2=document.getElementById("pw-new2");
      const ov=o?o.value:"",n1v=n1?n1.value:"",n2v=n2?n2.value:"";
      if(ov!==getPw()){set({pwChange:{msg:"❌ 현재 비밀번호가 틀렸어요.",ok:false}});return;}
      if(n1v.length<4){set({pwChange:{msg:"❌ 새 비밀번호는 4자 이상이어야 해요.",ok:false}});return;}
      if(n1v!==n2v){set({pwChange:{msg:"❌ 새 비밀번호가 서로 달라요.",ok:false}});return;}
      localStorage.setItem(PW_KEY,n1v);set({pwChange:{msg:"✅ 비밀번호가 변경되었습니다.",ok:true}});
    });
    // CSV 내보내기
    on("btn-export-csv",()=>{
      const rows=[["이름","학년","반","담임","등록일","U(다양성이해)","N(차이존중)","I(상호소통)","ON(공동체실천)","평균"]];
      S.students.forEach(s=>{
        const sc=s.scores;
        const avg=sc?Math.round((sc.U+sc.N+sc.I+sc.ON)/4):"";
        rows.push([s.name,s.grade,s.cls+"반",s.teacher||"",s.at,sc?sc.U:"",sc?sc.N:"",sc?sc.I:"",sc?sc.ON:"",avg]);
      });
      const csv="\uFEFF"+rows.map(r=>r.join(",")).join("\n");
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download="UNION+_진단결과_"+S.schoolYear+".csv";a.click();
      URL.revokeObjectURL(url);
      toast("CSV 파일이 다운로드됐어요.");
    });
    // 데이터 초기화
    on("btn-reset-data",()=>{if(confirm("정말로 모든 학생 데이터를 초기화할까요? 되돌릴 수 없어요.")){S.students=defData();saveSt(S.students);set({});toast("데이터가 초기화되었습니다.");}});
  }

  // ── 외부기관 ──
  if(page==="external"){
    if(menu==="ext_students"){onA(".ext-scd",e=>set({sid:e.currentTarget.dataset.id,menu:"ext_detail",lTags:[],lMemo:""}));}
    if(menu==="ext_detail"){
      on("bk",()=>set({menu:"ext_students"}));
      onA(".lt",e=>{const t=e.target.dataset.t;set({lTags:S.lTags.includes(t)?S.lTags.filter(x=>x!==t):[...S.lTags,t]});});
      const lm=document.getElementById("log-memo");if(lm){lm.value=S.lMemo;lm.addEventListener("input",()=>{S.lMemo=lm.value;});}
      on("btn-log-save",()=>{const lme=document.getElementById("log-memo");const memo=lme?lme.value.trim():"";if(!memo){toast("내용을 입력해주세요.");return;}const author=(S.extOrg||"외부기관")+(S.extName?" ("+S.extName+")":"");const lg={id:uid(),date:td(),author,tags:[...S.lTags],memo};set({students:S.students.map(x=>x.id===sid?{...x,logs:[lg,...x.logs]}:x),lMemo:"",lTags:[]});toast("기록이 저장되었습니다.");});
    }
  }
}

render();
</script>
</body>
</html>
